# Feature flag seed defaults.
# These values are only applied when a flag does not yet exist in the database.
# Once a flag exists in the DB, the DB value is authoritative — changing this
# file has no effect on already-seeded flags. Use the admin API to change live values.

flags:
  ai_itinerary_generation:
    enabled: true
    description: "Enable AI-powered itinerary generation via OpenAI"
  csv_export:
    enabled: true
    description: "Enable CSV export of trip data"
  activity_lodging_csv_import:
    enabled: false
    description: "Enable reviewed CSV imports for Activities and Lodging"
  activity_lodging_csv_export:
    enabled: false
    description: "Enable canonical CSV exports for Activities and Lodging"
  car_rentals:
    enabled: true
    description: "Enable car rental booking integration"
  trip_sharing:
    enabled: true
    description: "Enable sharing trips with other users"
  trip_following:
    enabled: true
    description: "Enable following other users' public trips"
  cost_tracking:
    enabled: true
    description: "Enable cost/expense tracking for trips"
  multiple_groups:
    enabled: true
    description: "Enable multiple traveler groups per account"
  trip_creation:
    enabled: true
    description: "Enable creation of new trips"
  feature_ingest_manual_upload:
    enabled: true
    description: "Phase 1 manual upload ingestion and review queue"
  feature_ingest_forwarded_mailbox:
    enabled: true
    description: "Phase 2 forwarded mailbox ingestion"
  feature_ingest_gmail_import:
    enabled: false
    description: "Phase 3 Gmail import and dry-run flows"
  feature_ingest_admin_observability:
    enabled: true
    description: "Enable admin ingestion observability widgets"
  feature_ingest_local_virus_scan_stub:
    enabled: true
    description: "Allow local development to skip virus scanning with a stub"
  ingestion_dual_llm_consensus:
    enabled: true
    description: "Run static extraction plus two independently metered LLM parsers for production imports"
  overview_weather:
    enabled: true
    description: "Show daily overview weather for nearby trips"
  flight_parser:
    enabled: true
    description: "Enable LLM-based flight parser from text/emails"
  itinerary_document_import:
    enabled: true
    description: "Allow Premium and Pro users to preview and import itinerary documents"
  itinerary_reactions:
    enabled: true
    description: "Enable up/down vote reactions on itinerary detail rows"
  merchant_category_lookup:
    enabled: true
    description: "Use Nominatim to look up merchant categories from receipt OCR vendor names"
  stripe_billing:
    enabled: true
    description: "Enable Stripe billing integration (master switch for all billing features)"
  stripe_checkout:
    enabled: true
    description: "Enable Stripe Checkout for new Premium subscription signups (web only for initial release)"
  stripe_customer_portal:
    enabled: true
    description: "Enable Stripe Customer Portal for subscription management (cancellation, payment update, plan switch)"
  premium_trials:
    enabled: true
    description: "Enable Premium free trial offers, trial eligibility tracking, and trial-ending reminders"
  attractions_transfer_directions_api:
    enabled: true
    description: "Use Google Directions/Distance Matrix API for inter-attraction transfer time instead of the haversine heuristic"
  getyourguide_activity_suggestions:
    enabled: true
    description: "Enable optional GetYourGuide affiliate activity suggestions (requires verified partner configuration)"
  feature_grid_editing:
    enabled: true
    description: "Enable Activities table editing, staged deletion, and bulk save"
  feature_grid_editing_clipboard:
    enabled: true
    description: "Enable web multi-cell selection and clipboard operations for the Activities grid"
  feature_standardized_item_dialogs:
    enabled: true
    description: "Enable shared flight, accommodation, and activity detail dialogs"
  feature_tap_to_edit_tables:
    enabled: true
    description: "Tap/click a Transfers, Lodging, Activities, or Car Rentals row to edit it, with sticky identity/actions columns. Kill switch for the row-press + sticky-column UX pass; disabling reverts to Edit-button-only rows with no sticky columns."
  feature_cover_photo_fallback_v2:
    enabled: true
    description: "Render a designed gradient placeholder (destination name) instead of a blank tile when a trip or day cover photo has no image yet. Kill switch for the placeholder art; disabling reverts to the plain empty fallback tile."
  feature_quick_start_trip_wizard:
    enabled: true
    description: "Default the Create Trip wizard to a 3-field Quick Start (name, destination, dates) with a Customize link into the full step wizard. Kill switch for the new entry point; disabling starts every new trip directly in the full step wizard."
  packing_lists_v2:
    enabled: true
    description: "Enable preset, provenance-aware packing lists v2"
  trip_day_map:
    enabled: false
    description: "Show a static multi-pin map (flights/lodging/activities/car rentals) on the Overview day-detail view. Off by default until a GOOGLE_STATIC_MAPS_API_KEY / GOOGLE_MAPS_API_KEY is provisioned; see docs/implementation_plans/implementation-plan-trip-day-map.md"
  trip_blog:
    enabled: true
    description: "Phase 1 joint trip blog (text + photo), private only"
  trip_blog_video_uploads:
    enabled: true
    description: "Phase 2 video upload and transcoding pipeline"
  trip_blog_google_photos_import:
    enabled: true
    description: "Phase 3 Google Photos album import and deep-linking"
  trip_blog_apple_photos_import:
    enabled: true
    description: "Apple Photos import"
  trip_blog_mobile_share_ios:
    enabled: false
    description: "A10 — iOS share extension and first-class quick-capture entry point"
  trip_blog_mobile_share_android:
    enabled: false
    description: "A10 — Android share intent and first-class quick-capture entry point"
  trip_blog_public_sharing:
    enabled: true
    description: "Phase 4 public sharing, consent flow, and vanity URLs"
  trip_blog_social_posting:
    enabled: true
    description: "Phase 5 Instagram/Facebook cross-posting for blog days"
  trip_blog_photo_uploads:
    enabled: true
    description: "Phase 2 private photo upload, normalization, and per-uploader quota"
  trip_blog_audio:
    enabled: false
    description: "A9 — bounded voice-note upload and playback"
  trip_blog_audio_transcription:
    enabled: false
    description: "A9 — Premium/Pro provider transcription of an uploaded voice note"
  trip_blog_translation:
    enabled: false
    description: "Phase 8 on-demand translation modality"
  trip_blog_exports:
    enabled: false
    description: "Phase 8 asynchronous blog export"
  trip_blog_item_audiences:
    enabled: false
    description: "Phase 8 per-item audience controls"
  trip_blog_structured_cards:
    enabled: true
    description: "Phase 8 allowlisted itinerary structured cards"
  trip_blog_galleries:
    enabled: true
    description: "Phase 8 gallery parent items"
  trip_blog_panorama_media:
    enabled: false
    description: "Phase 8 panorama and 360 degree media"
  trip_blog_ai_highlights:
    enabled: false
    description: "Phase 8 AI-proposed highlights"
  trip_blog_public_indexing:
    enabled: false
    description: "Phase 6 public sitemap and search indexing"
  trip_blog_search:
    enabled: false
    description: "C8 — visibility-aware, bounded private blog search UI and API"
  trip_blog_places:
    enabled: false
    description: "C6 — traveler-only places index derived from existing trip records without reverse geocoding"
  trip_blog_offline_queue:
    enabled: false
    description: "A11 — account/trip-scoped seven-day offline authoring queue"
  trip_blog_trip_awards:
    enabled: false
    description: "B10 — Trip Awards presentation derived from the durable recap snapshot"
  trip_blog_keepsake_export:
    enabled: false
    description: "C9 — local print/share keepsake renderer; no server-side export job"
  trip_blog_structured_data:
    enabled: true
    description: "Schema.org public blog metadata"
  # Phase 2 of docs/trip-blog-social-implementation-plan.md — engagement spine. Ships dark: no
  # route in server/src/routes/ checks these yet (that's Phase 3/4). Added now, default false and
  # fail-closed (see entitlementService.ts's FAIL_CLOSED_FLAGS), so the schema/service/flag rows
  # land together rather than the flags trailing the code that will gate on them.
  trip_blog_social_layer:
    enabled: false
    description: "Master kill switch for the trip blog social layer (reactions, comments, mentions); child flags below still apply"
  trip_blog_reactions:
    enabled: false
    description: "Phase 3 emoji reactions on blog days, items and photos/videos"
  trip_blog_comments:
    enabled: false
    description: "Phase 4 threaded comments; implies moderation, not separately flagged"
  trip_blog_mentions:
    enabled: false
    description: "Phase 4 @mentions in comments, trip-scoped autocomplete"
  trip_blog_public_engagement:
    enabled: false
    description: "Phase 4 unauthenticated public engagement endpoint (counts + public comments) on the public blog page"
  # Phase 5 of docs/trip-blog-social-implementation-plan.md — "what actually happened" (C1, C2, C3,
  # C5, C10, C11, A1, A2). trip_blog_authoring_assist is the parent surface for the Day Starter and
  # photo-first composer, per architecture §9.1's flag table; the two children below still apply.
  trip_blog_authoring_assist:
    enabled: false
    description: "Parent flag for Day Starter (A1) and the photo-first composer (A2)"
  trip_blog_day_starter:
    enabled: false
    description: "A1/A6 — deterministic day-starter template (Use/Rewrite/Not now), never an LLM call itself"
  trip_blog_photo_composer:
    enabled: false
    description: "A2 — photo-first composer with day buckets, an Unassigned bucket and pre-commit storage headroom"
  trip_blog_day_facts:
    enabled: false
    description: "C1, C3, C5 — the day fact strip and timeline rail; C2 (day map) additionally requires the existing trip_day_map flag"
  # Fail-closed (see entitlementService.ts's FAIL_CLOSED_FLAGS) — architecture §9.1: "the only new
  # externally-billed call in the feature set." A day map is rendered once per (trip-day,
  # points-hash) by a background job, never on a request path (architecture §14.1).
  trip_blog_day_map_render:
    enabled: false
    description: "Background day-map render job (§14.1) — writes a stored PNG via Google Static Maps once per (trip-day, points-hash); no request path ever calls out"
  # Phase 6 — every independently releasable surface defaults off. Caption AI and nudges are
  # fail-closed in entitlementService because they call a paid provider or contact a person.
  trip_blog_spend_summary:
    enabled: false
    description: "C4 — traveler-only client-side spend summary; never included in public recap payloads"
  trip_blog_recap:
    enabled: false
    description: "C7 — durable audience-scoped trip recap snapshots"
  trip_blog_alt_text:
    enabled: false
    description: "A8 — manual caption/alt-text editing and new-publication accessibility readiness"
  trip_blog_caption_ai:
    enabled: false
    description: "A8 — on-demand Premium/Pro caption and alt-text suggestions"
  trip_blog_nudges:
    enabled: false
    description: "B6 — bounded contribution nudges; requires durable notification inbox/outbox"
  # Phase 4.5 — architecture §9.1's notification flag table. All four are fail-closed
  # (entitlementService.ts's FAIL_CLOSED_FLAGS) since each either contacts a person outside the
  # app or is the kill switch for the delivery worker that would. Discovered missing entirely
  # during the Phases 0-7 audit — notificationRoutes.ts/notificationOutboxWorker.ts referenced
  # these by name, but with no row in this file (and no FAIL_CLOSED_FLAGS entry) they were
  # silently fail-open, i.e. always enabled, regardless of intent.
  notifications_in_app:
    enabled: false
    description: "In-app notification inbox — GET/PATCH /api/notifications/*"
  notifications_outbox_enabled:
    enabled: false
    description: "Master kill switch for the durable push/email delivery worker (§13.3)"
  notifications_push:
    enabled: false
    description: "Push notification delivery via Expo"
  notifications_web_push:
    enabled: false
    description: "Web push notification delivery"
  expense_import_plaid:
    enabled: false
    description: "Master switch for Plaid bank-link and transaction import"
  expense_import_plaid_link:
    enabled: false
    description: "Allow users to connect new bank accounts via Plaid Link"
  expense_import_plaid_sync:
    enabled: false
    description: "Allow background and manual transaction synchronization"
  expense_import_plaid_review_queue:
    enabled: false
    description: "Show transaction review queue in the UI"
  expense_import_plaid_assignment:
    enabled: false
    description: "Allow assigning transaction candidates to trip expenses"
  expense_import_plaid_webhooks:
    enabled: false
    description: "Process real-time transaction and revocation webhooks from Plaid"
  expense_import_plaid_auto_category:
    enabled: false
    description: "Suggest expense categories based on Plaid's categorization"
  itinerary_block_cache:
    enabled: true
    description: "Master switch for binding-plan-v2 (cached activity blocks and templates)"
  itinerary_block_cache_reads:
    enabled: true
    description: "Enable L0/shared v2 cache reads and legacy migration reads"
  itinerary_block_cache_writes:
    enabled: true
    description: "Enable write-through, repetition counters, and cleanup metadata"
  itinerary_block_cache_llm_binding:
    enabled: true
    description: "Enable lightweight model bind after deterministic selector failure"
  itinerary_block_cache_stale_revalidate:
    enabled: true
    description: "Enable low-risk stale serve and background refresh jobs"
  itinerary_corpus_authoring:
    enabled: true
    description: "Enable draft block authoring and external verification workers"
  itinerary_corpus_promotion:
    enabled: true
    description: "Enable human-reviewed immutable release promotion"
  itinerary_cache_prepopulation:
    enabled: true
    description: "Enable demand-driven batch planning and cache fills"
  itinerary_practical_notes:
    enabled: true
    description: "Enable country/region-scoped PracticalNote selection and rendering"
  itinerary_road_trip_lite:
    enabled: true
    description: "Enable provider-free private base-stay, travel-leg, deadline, and road-trip summary planning"
  itinerary_day_variants:
    enabled: true
    description: "Enable mutually exclusive whole-day road-trip variants"
  itinerary_timed_route_days:
    enabled: true
    description: "Enable deterministic road-trip deadline, slack, checkpoint, and optional-stop planning"
  itinerary_live_route_conditions:
    enabled: true
    description: "Enable optional capped Google Routes refinement for road-trip legs"
  itinerary_live_weather_variants:
    enabled: true
    description: "Enable optional capped near-departure weather selection for road-trip variants"
  itinerary_anchor_schedule_verification:
    enabled: true
    description: "Enable optional capped verification of selected time-critical anchor schedules"

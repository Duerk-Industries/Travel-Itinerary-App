providers:
  OPENAI:
    window: hour
    windowHours: 24
    overall: 1000
    callers:
      ITINERARY_GENERATE_PLAN: 50
      ITINERARY_PLAN_P0_NORM: 200
      ITINERARY_PLAN_P1_ROUTE: 200
      ITINERARY_PLAN_P2_DAYS: 200
      ITINERARY_PLAN_P3_VALIDATE: 200
      ITINERARY_PLAN_P4_RENDER: 200
      INGESTION_SMALL_LLM: 100
      INGESTION_LARGE_LLM: 50

  UNSPLASH:
    window: hour
    windowHours: 1
    overall: 50
    callers:
      IMAGE_SERVICE_LOCATION_IMAGE: 50
      IMAGE_SERVICE_ITINERARY_IMAGE: 50
      IMAGE_SERVICE_GOOGLE_PLACE_FALLBACK: 50
      UNSPLASH_HEALTH_CHECK: 50

  SMTP:
    window: hour
    windowHours: 24
    overall: 100
    callers:
      SHARE_EMAIL: 100
      VERIFICATION_EMAIL: 100
      TRIP_INVITE_EMAIL: 100

  AIRPORT_DATASET:
    window: hour
    windowHours: 24
    overall: 1000
    callers:
      DAILY_REFRESH: 500

  FRANKFURTER:
    window: hour
    windowHours: 24
    overall: 1000
    callers:
      INGESTION_ASSIGNMENT_FX: 1000

  OPEN_METEO:
    window: hour
    windowHours: 24
    overall: 2000
    callers:
      OVERVIEW_DAY_WEATHER_GEOCODE: 1000
      OVERVIEW_DAY_WEATHER_FORECAST: 1000

caching:
  attractions:
    refreshDays: 365
    limitPerDestination: 20
    shortlistPromptItemsPerDestination: 8
    minDistinctSourcesPerAttraction: 2
    minAttractionsAfterConfidenceFilter: 6
    promptBlobRefreshDays: 30
  locations:
    csvCacheTtlMinutes: 60
    refreshCooldownSeconds: 15
  images:
    cacheTtlMs: 604800000
    signedUrlTtlMs: 3600000
  googlePlaces:
    detailsCacheTimeoutMinutes: 1440
  unsplash:
    dnsLogTtlMs: 300000
  frankfurter:
    rateCacheTtlMinutes: 1440
  weather:
    geocodeCacheTtlMinutes: 1440
    forecastCacheTtlMinutes: 60

  COUNTRY_NOW: 0
  GEONAMES: 0
  AIRPORT_DATASET: 0
  FRANKFURTER: 0
  OPEN_METEO: 0
  GETYOURGUIDE: 0

caching:
  attractions:
    refreshDays: 365
    limitPerDestination: 20
    shortlistPromptItemsPerDestination: 8
    # itinerary-improvements-coding-plan.md Phase 3C: adaptive shortlist ceiling.
    # Trip length > 7 days, multiple destinations, >=5 high-weight interests, or a
    # coverage-check miss against the base shortlistPromptItemsPerDestination
    # (floor) rebuilds the shortlist up to this cap instead of the floor. Hard
    # ceiling is 15 regardless of what's configured here. If an operator sets
    # this equal to (or below) the floor, adaptive logic is a no-op and every
    # trip stays on the fixed floor-item behavior.
    adaptiveShortlistMax: 12
    minDistinctSourcesPerAttraction: 2
    minAttractionsAfterConfidenceFilter: 6
    promptBlobRefreshDays: 30
    durationMetadataRefreshDays: 60
    # Short negative-cache TTL: a duration-metadata row with no Wikipedia
    # description (fetch failed/outage/no article) refreshes this often
    # instead of waiting the full durationMetadataRefreshDays, so a transient
    # provider outage isn't cached as "no data" for 60 days.
    durationMetadataNegativeRefreshDays: 1
  itineraryPlan:
    routeCacheTtlDays: 60
    dayCacheTtlDays: 30
    shadowSamplePercent: 5
    # Selective p2 model escalation is disabled until production metrics prove
    # that the trigger cases correlate with measurable quality loss.
    escalationEnabled: 0
    escalationMinDays: 10
    escalationMinDestinations: 3
    escalationMinCoveragePercent: 0.5
    # 1 = gpt-4o; keep this numeric because cache settings are validated as numbers.
    escalationModel: 1
    chunkingEnabled: 1
    chunkingMinDays: 8
    chunkSizeDays: 3
    # itinerary-improvements-coding-plan.md Phase 4A: mechanical p3 checks (meal codes,
    # item caps, verified closures, recovery-day rules) run first; only call the LLM p3
    # validator when those checks actually changed something. Default on — this is a
    # required cost-saving behavior, not an opt-in experiment.
    skipValidatorWhenClean: 1
    # itinerary-improvements-coding-plan.md Phase 4B: deterministic must-see/pod-proximity fill
    # for thin days (fewer than ~2 items). Zero token cost; default on.
    dayFillEnabled: 1
    # Single, batched targeted-repair call (at most one per generation), only invoked when
    # deterministic fill above could not raise every thin day to the minimum. Disabled by
    # default until production Phase 1 metrics show how often deterministic fill alone leaves
    # days thin — same "measure before spending" posture as escalationEnabled above.
    dayFillRepairEnabled: 0
    # Phase 2B: augment LOGISTICS_FACTS with per-destination climatology/daylight
    # facts from destinationLogisticsService.buildDestinationLogistics. Only runs
    # when the (already fetched) attraction shortlist has coordinates, so it never
    # adds extra network calls when the shortlist block is empty/mocked.
    logisticsClimatologyEnabled: 1
  locations:
    csvCacheTtlMinutes: 60
    refreshCooldownSeconds: 15
  images:
    cacheTtlMs: 604800000
    signedUrlTtlMs: 3600000
  googlePlaces:
    detailsCacheTimeoutMinutes: 1440
  googleStaticMaps:
    cacheTtlMinutes: 1440
  # Phase 0 guardrails for the optional GetYourGuide integration. No Partner
  # API calls are enabled until the verified partner quota/terms are recorded.
  # The API TTL values are reserved configuration only; do not persist GYG
  # content until written partner permission is recorded.
  getYourGuide:
    redirectTokenTtlMinutes: 10
    freshTtlMinutes: 15
    staleTtlHours: 24
    maxAffiliateLinksPerItinerary: 4
    maxAffiliateCandidatesPerDay: 2
    descriptorConcurrency: 2
    maxPartnerApiLookupsPerGeneration: 0
    maxPartnerApiLookupsPerDay: 0
    apiTimeoutMs: 4000
    apiMaxRetries: 1
    circuitFailureThreshold: 3
    circuitOpenSeconds: 30
    redirectPerMinutePerIp: 60
    redirectPerDayPerAccount: 300
  unsplash:
    dnsLogTtlMs: 300000
  frankfurter:
    rateCacheTtlMinutes: 1440
  weather:
    geocodeCacheTtlMinutes: 1440
    forecastCacheTtlMinutes: 60

  # doc also lists are added by the phases that actually introduce those calls (Phase 3/4 routes,
  # Phase 4.5 notifications, Phase 6 recap) — reserveApiUsageOrThrow's `requireConfiguredLimit`
  # only demands a caller exist once code actually calls it under that name, so listing callers
  # nothing calls yet would be dead configuration, not a safety requirement.
  TRIP_BLOG_SOCIAL_API:
    window: day
    windowHours: 24
    overall: 100000
    callers:
      BLOG_DOCUMENT_READ: 30000
      BLOG_REACTION_WRITE: 15000
      BLOG_COMMENT_WRITE: 5000

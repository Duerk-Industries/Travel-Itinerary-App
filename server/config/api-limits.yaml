budgeting:
  OPENAI:
    alertThresholdPercent: 80
    models:
      GPT_4O_MINI:
        inputCostPer1MTokensUsd: 0.15
        outputCostPer1MTokensUsd: 0.60
  ANTHROPIC:
    alertThresholdPercent: 80
    models:
      # Key must match normalizeApiLimitKeyPart(ANTHROPIC_DEFAULT_MODEL) in
      # anthropicProvider.ts ('claude-sonnet-4-5' -> 'CLAUDE_SONNET_4_5'), or
      # estimateAiCostMicros silently returns null and no cost is recorded.
      CLAUDE_SONNET_4_5:
        inputCostPer1MTokensUsd: 3.00
        outputCostPer1MTokensUsd: 15.00
  GEMINI:
    alertThresholdPercent: 80
    models:
      # Must match normalizeApiLimitKeyPart(GEMINI_DEFAULT_MODEL) in
      # geminiProvider.ts ('gemini-2.5-flash' -> 'GEMINI_2_5_FLASH').
      GEMINI_2_5_FLASH:
        inputCostPer1MTokensUsd: 0.30
        outputCostPer1MTokensUsd: 2.50
  OPENAI_COMPATIBLE:
    alertThresholdPercent: 80
    models: {}
  ZAI:
    alertThresholdPercent: 80
    models:
      # Must match normalizeApiLimitKeyPart(ZAI_DEFAULT_MODEL) in
      # zaiProvider.ts ('glm-4.7' -> 'GLM_4_7').
      GLM_4_7:
        inputCostPer1MTokensUsd: 0.10
        outputCostPer1MTokensUsd: 0.10
  SHADOW_PARSE:
    monthlyBudgetUsd: 20
    alertThresholdPercent: 80
    models: {}

# Per-request USD price for providers that aren't token-priced. 0 = genuinely free today; the admin
# cost-estimator panel (Phase 3) will make these editable without a code deploy. Unlisted providers
# default to 0 via getApiRequestPricingUsd().

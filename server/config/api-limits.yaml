budgeting:
  OPENAI:
    alertThresholdPercent: 80
    models:
      GPT_4O_MINI:
        inputCostPer1MTokensUsd: 0.15
        outputCostPer1MTokensUsd: 0.60
  ANTHROPIC:
    alertThresholdPercent: 80
    models:
      # Key must match normalizeApiLimitKeyPart(ANTHROPIC_DEFAULT_MODEL) in
      # anthropicProvider.ts ('claude-sonnet-4-5' -> 'CLAUDE_SONNET_4_5'), or
      # estimateAiCostMicros silently returns null and no cost is recorded.
      CLAUDE_SONNET_4_5:
        inputCostPer1MTokensUsd: 3.00
        outputCostPer1MTokensUsd: 15.00
  GEMINI:
    alertThresholdPercent: 80
    models:
      # Must match normalizeApiLimitKeyPart(GEMINI_DEFAULT_MODEL) in
      # geminiProvider.ts ('gemini-2.5-flash' -> 'GEMINI_2_5_FLASH').
      GEMINI_2_5_FLASH:
        inputCostPer1MTokensUsd: 0.30
        outputCostPer1MTokensUsd: 2.50
  OPENAI_COMPATIBLE:
    alertThresholdPercent: 80
    models: {}
  ZAI:
    alertThresholdPercent: 80
    models:
      # Must match normalizeApiLimitKeyPart(ZAI_DEFAULT_MODEL) in
      # zaiProvider.ts ('glm-4.7' -> 'GLM_4_7').
      GLM_4_7:
        inputCostPer1MTokensUsd: 0.10
        outputCostPer1MTokensUsd: 0.10
  SHADOW_PARSE:
    monthlyBudgetUsd: 20
    alertThresholdPercent: 80
    models: {}

# Per-request USD price for providers that aren't token-priced. 0 = genuinely free today; the admin
# cost-estimator panel (Phase 3) will make these editable without a code deploy. Unlisted providers
# default to 0 via getApiRequestPricingUsd().
requestPricing:
  SERPAPI: 0
  WIKIMEDIA: 0
  GOOGLE_ROUTES: 0
  GMAIL: 0
  GOOGLE_STATIC_MAPS: 0
  NOMINATIM: 0
  CLAMAV: 0
  DOCLING: 0
  UNSPLASH: 0
  SMTP: 0
  COUNTRY_NOW: 0
  GEONAMES: 0
  AIRPORT_DATASET: 0
  FRANKFURTER: 0
  OPEN_METEO: 0

caching:
  attractions:
    refreshDays: 365
    limitPerDestination: 20
    shortlistPromptItemsPerDestination: 8
    minDistinctSourcesPerAttraction: 2
    minAttractionsAfterConfidenceFilter: 6
    promptBlobRefreshDays: 30
    durationMetadataRefreshDays: 60
  itineraryPlan:
    routeCacheTtlDays: 60
    dayCacheTtlDays: 30
    shadowSamplePercent: 5
  locations:
    csvCacheTtlMinutes: 60
    refreshCooldownSeconds: 15
  images:
    cacheTtlMs: 604800000
    signedUrlTtlMs: 3600000
  googlePlaces:
    detailsCacheTimeoutMinutes: 1440
  googleStaticMaps:
    cacheTtlMinutes: 1440
  # Phase 0 guardrails for the optional GetYourGuide integration. No Partner
  # API calls are enabled until the verified partner quota/terms are recorded.
  # The API TTL values are reserved configuration only; do not persist GYG
  # content until written partner permission is recorded.
  getYourGuide:
    redirectTokenTtlMinutes: 10
    freshTtlMinutes: 15
    staleTtlHours: 24
    maxAffiliateLinksPerItinerary: 4
    maxAffiliateCandidatesPerDay: 2
    descriptorConcurrency: 2
    maxPartnerApiLookupsPerGeneration: 0
    maxPartnerApiLookupsPerDay: 0
    redirectPerMinutePerIp: 60
    redirectPerDayPerAccount: 300
  unsplash:
    dnsLogTtlMs: 300000
  frankfurter:
    rateCacheTtlMinutes: 1440
  weather:
    geocodeCacheTtlMinutes: 1440
    forecastCacheTtlMinutes: 60

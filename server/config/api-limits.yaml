      BLOG_DAY_FACTS_READ: 10000
      BLOG_AUTHORING_WRITE: 5000
      # Phase 6 — reads are cheap and separately visible; only a cache miss consumes BUILD.
      BLOG_RECAP_READ: 10000
      BLOG_RECAP_BUILD: 500
      BLOG_COVER_PROPOSAL_READ: 10000
      BLOG_CAPTION_REQUEST: 5000
      BLOG_PUBLICATION_READINESS_READ: 5000
      # Phase 7 — every new request path is independently visible and capped. Offline flushes use
      # BLOG_AUTHORING_WRITE when they reach the existing item endpoint; local queue operations do
      # not consume server capacity.
      BLOG_SEARCH_READ: 10000
      BLOG_PLACES_READ: 5000
      BLOG_QUICK_CAPTURE_HANDOFF: 5000

  # Every new database operation has a finite, DB-atomic unit cap. These are operation units,
  # not retained bytes; retained recap payloads use the capacity gauge below.
  TRIP_BLOG_SOCIAL_STORAGE:
    window: day
    windowHours: 24
    overall: 610000
    callers:
      DATABASE_READ_UNIT: 500000
      DATABASE_WRITE_UNIT: 100000
      DATABASE_DELETE_UNIT: 10000

  TRIP_BLOG_SOCIAL_CAPACITY:
    overall: 4194304
    callers:
      RECAP_RETAINED_KIB: 2097152
      TEXT_RETAINED_KIB: 2097152

budgeting:
  OPENAI:
    alertThresholdPercent: 80
    models:
      GPT_4O_MINI:
        inputCostPer1MTokensUsd: 0.15
        outputCostPer1MTokensUsd: 0.60
      GPT_5_6_LUNA:
        inputCostPer1MTokensUsd: 0.20
        outputCostPer1MTokensUsd: 1.20
  ANTHROPIC:
    alertThresholdPercent: 80
    models:
      # Key must match normalizeApiLimitKeyPart(ANTHROPIC_DEFAULT_MODEL) in
      # anthropicProvider.ts ('claude-sonnet-4-5' -> 'CLAUDE_SONNET_4_5'), or
      # estimateAiCostMicros silently returns null and no cost is recorded.
      CLAUDE_SONNET_4_5:
        inputCostPer1MTokensUsd: 3.00
        outputCostPer1MTokensUsd: 15.00
  GEMINI:
    alertThresholdPercent: 80
    models:
      # Must match normalizeApiLimitKeyPart(GEMINI_DEFAULT_MODEL) in
      # geminiProvider.ts ('gemini-2.5-flash' -> 'GEMINI_2_5_FLASH').
      GEMINI_2_5_FLASH:
        inputCostPer1MTokensUsd: 0.30
        outputCostPer1MTokensUsd: 2.50
  OPENAI_COMPATIBLE:
    alertThresholdPercent: 80
    models: {}
  ZAI:
    alertThresholdPercent: 80
    models:
      # Must match normalizeApiLimitKeyPart(ZAI_DEFAULT_MODEL) in
      # zaiProvider.ts ('glm-4.7' -> 'GLM_4_7').
      GLM_4_7:
        inputCostPer1MTokensUsd: 0.10
        outputCostPer1MTokensUsd: 0.10
  SHADOW_PARSE:
    monthlyBudgetUsd: 20
    alertThresholdPercent: 80
    models: {}
  # $0.002/request at Google's standard Static Maps pricing ($2 per 1000
  # loads). Ceiling below assumes the hard per-day caller caps above never
  # get raised without revisiting this number too: 800/day * 30 = 24,000
  # requests/mo worst case = ~$48; 24h response caching keeps real spend far
  # below that in practice. Budget is intentionally set below the worst case
  # so the 80% alert fires with real headroom left before a runaway cost.
  GOOGLE_STATIC_MAPS:
    monthlyBudgetUsd: 15
    alertThresholdPercent: 80
    models: {}

# Per-request USD price for providers that aren't token-priced. 0 = genuinely free today; the admin
# cost-estimator panel (Phase 3) will make these editable without a code deploy. Unlisted providers
# default to 0 via getApiRequestPricingUsd().
requestPricing:
  INGESTION_STORAGE: 0.000004
  SERPAPI: 0
  WIKIMEDIA: 0
  GOOGLE_ROUTES: 0
  GMAIL: 0
  # Standard tier, $2 per 1000 Static Maps loads. Was explicitly priced at $0
  # here before (a placeholder, not a real free tier) even though the
  # STATIC_MAP_PREVIEW caller has been live since the lodging details dialog
  # shipped — cost tracking silently recorded $0 for every call. Fixing this
  # makes that existing feature's cost visible too, not just the new
  # trip_day_map caller.
  GOOGLE_STATIC_MAPS: 0.002
  NOMINATIM: 0
  CLAMAV: 0
  DOCLING: 0
  UNSPLASH: 0
  SMTP: 0
  COUNTRY_NOW: 0
  GEONAMES: 0
  AIRPORT_DATASET: 0
  FRANKFURTER: 0
  OPEN_METEO: 0
  ITINERARY_CACHE_STORAGE: 0
  GETYOURGUIDE: 0
  META_GRAPH: 0
  GOOGLE_PHOTOS: 0
  CLOUD_VISION: 0.0015 # $1.50 per 1000 images

caching:
  attractions:
    refreshDays: 365
    limitPerDestination: 20
    shortlistPromptItemsPerDestination: 8
    # itinerary-improvements-coding-plan.md Phase 3C: adaptive shortlist ceiling.
    # Trip length > 7 days, multiple destinations, >=5 high-weight interests, or a
    # coverage-check miss against the base shortlistPromptItemsPerDestination
    # (floor) rebuilds the shortlist up to this cap instead of the floor. Hard
    # ceiling is 15 regardless of what's configured here. If an operator sets
    # this equal to (or below) the floor, adaptive logic is a no-op and every
    # trip stays on the fixed floor-item behavior.
    adaptiveShortlistMax: 12
    minDistinctSourcesPerAttraction: 2
    minAttractionsAfterConfidenceFilter: 6
    promptBlobRefreshDays: 30
    durationMetadataRefreshDays: 60
    # Short negative-cache TTL: a duration-metadata row with no Wikipedia
    # description (fetch failed/outage/no article) refreshes this often
    # instead of waiting the full durationMetadataRefreshDays, so a transient
    # provider outage isn't cached as "no data" for 60 days.
    durationMetadataNegativeRefreshDays: 1
  itineraryPlan:
    routeCacheTtlDays: 60
    dayCacheTtlDays: 30
    shadowSamplePercent: 5
    # Selective p2 model escalation is disabled until production metrics prove
    # that the trigger cases correlate with measurable quality loss.
    escalationEnabled: 0
    escalationMinDays: 10
    escalationMinDestinations: 3
    escalationMinCoveragePercent: 0.5
    # 1 = gpt-4o; keep this numeric because cache settings are validated as numbers.
    escalationModel: 1
    chunkingEnabled: 1
    chunkingMinDays: 8
    chunkSizeDays: 3
    # itinerary-improvements-coding-plan.md Phase 4A: mechanical p3 checks (meal codes,
    # item caps, verified closures, recovery-day rules) run first; only call the LLM p3
    # validator when those checks actually changed something. Default on — this is a
    # required cost-saving behavior, not an opt-in experiment.
    skipValidatorWhenClean: 1
    # itinerary-improvements-coding-plan.md Phase 4B: deterministic must-see/pod-proximity fill
    # for thin days (fewer than ~2 items). Zero token cost; default on.
    dayFillEnabled: 1
    # Single, batched targeted-repair call (at most one per generation), only invoked when
    # deterministic fill above could not raise every thin day to the minimum. Default on —
    # full test coverage exists for the cap/fallback behavior (dayFillService.test.ts,
    # dayFillRepairIntegration.test.ts), so this branch's shipped state is the baseline
    # rather than waiting on separate production metrics.
    dayFillRepairEnabled: 1
    # Phase 2B: augment LOGISTICS_FACTS with per-destination climatology/daylight
    # facts from destinationLogisticsService.buildDestinationLogistics. Only runs
    # when the (already fetched) attraction shortlist has coordinates, so it never
    # adds extra network calls when the shortlist block is empty/mocked.
    logisticsClimatologyEnabled: 1
  locations:
    csvCacheTtlMinutes: 60
    refreshCooldownSeconds: 15
  images:
    cacheTtlMs: 604800000
    signedUrlTtlMs: 3600000
  googlePlaces:
    detailsCacheTimeoutMinutes: 1440
  googleStaticMaps:
    cacheTtlMinutes: 1440
    # Hard cap on markers per trip_day_map request. Keeps the outbound Google
    # Static Maps URL well under their documented length limits and keeps the
    # rendered image legible. Excess points are dropped server-side (earliest
    # items in the day kept) rather than erroring the whole map.
    maxPointsPerTripDayMap: 12
  # Phase 0 guardrails for the optional GetYourGuide integration. No Partner
  # API calls are enabled until the verified partner quota/terms are recorded.
  # The API TTL values are reserved configuration only; do not persist GYG
  # content until written partner permission is recorded.
  getYourGuide:
    redirectTokenTtlMinutes: 10
    freshTtlMinutes: 15
    staleTtlHours: 24
    maxAffiliateLinksPerItinerary: 4
    maxAffiliateCandidatesPerDay: 2
    descriptorConcurrency: 2
    maxPartnerApiLookupsPerGeneration: 0
    maxPartnerApiLookupsPerDay: 0
    apiTimeoutMs: 4000
    apiMaxRetries: 1
    circuitFailureThreshold: 3
    circuitOpenSeconds: 30
    redirectPerMinutePerIp: 60
    redirectPerDayPerAccount: 300
  unsplash:
    dnsLogTtlMs: 300000
    urlLookupTtlMs: 600000
    negativeUrlLookupTtlMs: 86400000
  frankfurter:
    rateCacheTtlMinutes: 1440
  weather:
    geocodeCacheTtlMinutes: 1440
    forecastCacheTtlMinutes: 60
  tripBlog:
    maxTextBlocksPerDay: 10
    maxMediaItemsPerDay: 50
    videoMaxDurationSeconds: 60
    signedUrlTtlMs: 3600000
    cdnCacheTtlSeconds: 86400
    maxUploadInitPerMinutePerAccount: 30
    maxAssetsPerGallery: 30
    maxUploadBytesPerDay: 1073741824
    maxProcessingJobsPerAccount: 4
    publicReadsPerMinutePerIp: 120
    importItemsPerRun: 100
    translationCharactersPerMonth: 100000
    exportJobsPerMonth: 4
    # Phase 2 — engagement spine. commentMaxLength/commentEditWindowSeconds/
    # hideStrikesBeforeBlock are enforced today as hardcoded constants in
    # postgresEngagementRepository.ts/firebaseEngagementRepository.ts, matching the existing
    # precedent set by blog_text_contents' 100,000-char cap (also hardcoded in the repository, not
    # read from config). These entries exist so the values are discoverable and so the Phase 3/4
    # routes that add rate limiting can read commentsPerMinutePerUser/reactionsPerMinutePerUser
    # from here rather than inventing their own constants.
    commentMaxLength: 2000
    commentsPerMinutePerUser: 10
    commentsPerDayPerUser: 100
    reactionsPerMinutePerUser: 60
    reactionsPerDayPerUser: 500
    commentPageSize: 20
    replyPreviewCount: 3
    commentEditWindowSeconds: 900
    hideStrikesBeforeBlock: 3
    publicEngagementReadsPerMinutePerIp: 60
    publicEngagementCommentsPageSize: 20
    # Phase 5 — architecture §7.1: facts are computed per request and cached in-process, keyed by
    # trip/day/audience class/source revisions; never persisted (every input already is elsewhere).
    factsCacheTtlMs: 60000
    # Phase 5 — architecture §14.1: a day map re-renders only when its points hash changes, and even
    # then at most this often per trip-day, so an itinerary edited several times in one afternoon
    # doesn't re-trigger the render job on every save.
    dayMapRerenderMinIntervalHours: 24
    recapLeaseSeconds: 60
    recapSnapshotsPerTrip: 3
    recapGenerationsPerDayPerTrip: 5
    captionSuggestionsPerDayPerUser: 10
    captionSuggestionsPerMonthPremium: 100
    nudgeDedupeHours: 72
    nudgeSuppressDaysAfterTrip: 30
    searchQueryMaxLength: 100
    searchPageSize: 20
    searchScanMaxItems: 500
    placesPageSize: 100
    placesReadUnitsFirebase: 2000
    offlineQueueMaxEntries: 25
    offlineQueueRetentionDays: 7
    audioMaxBytes: 26214400

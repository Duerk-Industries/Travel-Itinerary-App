# Monthly cost assumptions for the estimator.
#
# Tier alignment:
# - "Basic" maps to the app's current free/default tier: 5 AI itinerary
#   generations/month, no ingestion, no Gmail import, no forwarded mailbox.
# - "Premium" maps to the app's premium tier: ingestion is allowed with the
#   current 50 uploads/month and 30-day Gmail lookback. Premium AI generation is
#   unlimited in the app, so this file uses a production planning estimate.
#
# Provider-limit alignment:
# server/config/api-limits.yaml is an aggregate throttle config, not a user-tier
# quota file. At 10,000 users, several production estimates below exceed those
# current aggregate throttles. Comments call those out; the assumption for this
# model is that production limits are raised and paid provider tiers are used
# where required.
settings:
  rowStep: 100
  maxUsers: 10000

userMix:
  # Premium users are assumed to be 1% of Basic users:
  # Basic = 100 / 101, Premium = 1 / 101.
  Basic: 0.99
  Premium: 0.01

usagePerUser:
  Basic:
    # Basic/free allows 5 AI itinerary generations/month. These token estimates
    # model that full allowance at about 6k input and 2k output tokens each.
    # At 10k users this exceeds the current aggregate OPENAI throttle
    # (50 ITINERARY_GENERATE_PLAN calls/day and 200 calls/day for each plan
    # stage), so production must raise provider/app limits for this volume.
    openai:
      input_tokens: 30000
      output_tokens: 10000
    googlePlaces:
      place_details_requests: 2
    googleAi:
      input_tokens: 0
      output_tokens: 0
    # Current UNSPLASH throttle is 50/hour. This monthly estimate should fit at
    # 10k users if traffic is smoothed and app image caching remains effective.
    unsplash:
      requests: 1
    # Current SMTP throttle is 100/day aggregate. At 10k users, 1 message/user
    # per month is above that monthly capacity; production should raise SMTP
    # limits or use a paid transactional email tier.
    smtp:
      messages: 1
    # Basic/free users are not entitled to ingestion or Gmail import.
    gmail:
      token_requests: 0
      profile_requests: 0
      message_list_requests: 0
      message_get_requests: 0
      attachment_requests: 0
    mailgun:
      inbound_messages: 0
      inbound_attachments: 0
    docling:
      document_conversions: 0
    # Current OPEN_METEO throttle is 2,000/day aggregate split across geocode
    # and forecast callers. This estimate fits monthly volume at 10k users, but
    # peak-day traffic may still require smoothing/caching.
    openMeteo:
      geocode_requests: 1
      forecast_requests: 2
      climatology_requests: 0.02
    # Destination catalogs are shared for 365 days, so discovery/enrichment
    # requests amortize across users rather than occurring per generation.
    serpApi:
      searches: 0.01
    wikimedia:
      discovery_requests: 0.02
      enrichment_requests: 0.2
      summary_requests: 0.1
      pageview_requests: 0.2
    frankfurter:
      requests: 2
    airportDataset:
      requests: 0
    tripBlogSocial:
      cloud_run_requests: 18
      # Includes bounded Phase 7 search/places reads; Firestore reserves the configured scan
      # ceiling before each request, while this is the expected (not hard-cap) monthly case.
      firestore_reads: 180
      firestore_writes: 5
      firestore_deletes: 0.5
      retained_kib_month: 4
      static_map_requests: 0.5
      ai_caption_input_tokens: 0
      ai_caption_output_tokens: 0
      voice_note_gb_month: 0
      keepsake_exports: 0.25
    googleCloudHosting:
      # Incremental Activities grid planning allowance: +2 requests, +80 reads,
      # and +40 writes per Basic user/month.
      cloud_run_requests: 32
      firestore_reads: 680
      firestore_writes: 130
      storage_gb_month: 0.02
      egress_gb: 0.05
    plaidTransactions:
      connected_item_months: 0
      link_token_creates: 0
      public_token_exchanges: 0
      sync_calls: 0
      webhook_deliveries: 0
    plaidGoogleCloud:
      function_invocations: 0
      firestore_reads: 0
      firestore_writes: 0
      firestore_deletes: 0
      secret_manager_accesses: 0
      kms_encryptions: 0
      kms_decryptions: 0
      retained_transaction_docs: 0
      directory_reads: 0
      webhook_event_writes: 0
      sync_job_writes: 0
      review_queue_reads: 0
      assignment_reads: 0
      assignment_writes: 0
    itineraryCache:
      # Tier 0/1 scenarios for Basic. Most users stay on legacy generation
      # while the corpus expanded.
      binding_reads: 2
      binding_writes: 0.1
      corpus_reads: 2
      author_tokens_input: 0
      author_tokens_output: 0
      binder_tokens_input: 1000
      binder_tokens_output: 100
      retained_kib_month: 2
      road_trip_private_reads: 2
      road_trip_private_writes: 0
      route_matrix_elements: 0
      weather_requests: 0
      schedule_verifications: 0
  Premium:
    # Premium has unlimited AI itinerary generations in current tier config.
    # This model assumes a production planning average of 20 generations/month
    # at about 8k input and 3k output tokens each, plus ingestion extraction.
    # This is intentionally different from current unlimited entitlement and
    # requires raised OPENAI throttles for the 10k-user scenario.
    openai:
      input_tokens: 250000
      output_tokens: 90000
    googlePlaces:
      place_details_requests: 20
    # Gemini flight parser is present in the app and defaults on when
    # LLM_PROVIDER is unset. No matching aggregate api-limits provider exists
    # today, so add one before relying on this in production.
    googleAi:
      input_tokens: 1000000
      output_tokens: 100000
    unsplash:
      requests: 10
    smtp:
      messages: 6
    # Premium Gmail syncs are limited by current code to 30/month because the
    # limit is derived from the 30-day Gmail lookback. Each sync can list up to
    # 25 candidate messages, so message_get_requests models the max search pass.
    gmail:
      token_requests: 1
      profile_requests: 1
      message_list_requests: 30
      message_get_requests: 750
      attachment_requests: 50
    # Premium ingestion permits 50 uploads/month. Forwarded mailbox deliveries
    # share that same monthly upload allowance.
    mailgun:
      inbound_messages: 50
      inbound_attachments: 50
    docling:
      document_conversions: 50
    openMeteo:
      geocode_requests: 5
      forecast_requests: 10
      climatology_requests: 0.1
    serpApi:
      searches: 0.05
    wikimedia:
      discovery_requests: 0.1
      enrichment_requests: 1
      summary_requests: 0.5
      pageview_requests: 1
    frankfurter:
      requests: 50
    airportDataset:
      requests: 0
    tripBlogSocial:
      cloud_run_requests: 70
      firestore_reads: 1200
      firestore_writes: 22
      firestore_deletes: 2
      retained_kib_month: 16
      static_map_requests: 1.5
      # Ten caption suggestions plus retry/headroom, bounded by api-limits.yaml.
      ai_caption_input_tokens: 13000
      ai_caption_output_tokens: 2100
      voice_note_gb_month: 0.01
      keepsake_exports: 1
    googleCloudHosting:
      # Incremental Activities grid planning allowance: +6 requests, +480 reads,
      # and +240 writes per Premium user/month.
      cloud_run_requests: 126
      firestore_reads: 2880
      firestore_writes: 590
      storage_gb_month: 0.08
      egress_gb: 0.2
    plaidTransactions:
      connected_item_months: 1
      link_token_creates: 1
      public_token_exchanges: 1
      sync_calls: 10
      webhook_deliveries: 10
    plaidGoogleCloud:
      function_invocations: 15
      firestore_reads: 100
      firestore_writes: 60
      firestore_deletes: 40
      secret_manager_accesses: 1
      kms_encryptions: 1
      kms_decryptions: 10
      retained_transaction_docs: 250
      directory_reads: 10
      webhook_event_writes: 10
      sync_job_writes: 10
      review_queue_reads: 10
      assignment_reads: 10
      assignment_writes: 10
    itineraryCache:
      # Premium users hit corpus-covered destinations more often.
      binding_reads: 15
      binding_writes: 1
      corpus_reads: 20
      author_tokens_input: 5000
      author_tokens_output: 2000
      binder_tokens_input: 10000
      binder_tokens_output: 1000
      retained_kib_month: 10
      road_trip_private_reads: 15
      road_trip_private_writes: 1
      route_matrix_elements: 0
      weather_requests: 0
      schedule_verifications: 0

costSources:
  - id: google_cloud_baseline
    name: Google Cloud baseline hosting
    type: fixed
    monthlyCostUsd: 25

  - id: google_cloud_usage
    name: Google Cloud usage
    type: variable
    api: googleCloudHosting
    usageLevels:
      - metric: cloud_run_requests
        unitCostUsd: 0.40
        perUnits: 1000000
      - metric: firestore_reads
        unitCostUsd: 0.06
        perUnits: 100000
      - metric: firestore_writes
        unitCostUsd: 0.18
        perUnits: 100000
      - metric: storage_gb_month
        unitCostUsd: 0.026
      - metric: egress_gb
        unitCostUsd: 0.12

  - id: openai_gpt_4o_mini
    name: OpenAI GPT-4o mini
    type: variable
    api: openai
    usageLevels:
      - metric: input_tokens
        unitCostUsd: 0.15
        perUnits: 1000000
      - metric: output_tokens
        unitCostUsd: 0.60
        perUnits: 1000000

  - id: google_places
    name: Google Places details
    type: variable
    api: googlePlaces
    usageLevels:
      - metric: place_details_requests
        unitCostUsd: 0
        perUnits: 1000

  - id: google_ai_gemini
    name: Google AI Gemini flight parser
    type: variable
    api: googleAi
    usageLevels:
      - metric: input_tokens
        unitCostUsd: 0
        perUnits: 1000000
      - metric: output_tokens
        unitCostUsd: 0
        perUnits: 1000000

  - id: unsplash
    name: Unsplash
    type: variable
    api: unsplash
    usageLevels:
      - metric: requests
        unitCostUsd: 0

  - id: smtp
    name: SMTP email
    type: variable
    api: smtp
    usageLevels:
      - metric: messages
        unitCostUsd: 0

  - id: gmail
    name: Gmail import API
    type: variable
    api: gmail
    usageLevels:
      - metric: token_requests
        unitCostUsd: 0
      - metric: profile_requests
        unitCostUsd: 0
      - metric: message_list_requests
        unitCostUsd: 0
      - metric: message_get_requests
        unitCostUsd: 0
      - metric: attachment_requests
        unitCostUsd: 0

  - id: mailgun
    name: Mailgun inbound webhook
    type: variable
    api: mailgun
    usageLevels:
      - metric: inbound_messages
        unitCostUsd: 0
      - metric: inbound_attachments
        unitCostUsd: 0

  - id: docling
    name: Docling document conversion
    type: variable
    api: docling
    usageLevels:
      - metric: document_conversions
        unitCostUsd: 0

  - id: open_meteo
    name: Open-Meteo weather
    type: variable
    api: openMeteo
    usageLevels:
      - metric: geocode_requests
        unitCostUsd: 0
      - metric: forecast_requests
        unitCostUsd: 0
      - metric: climatology_requests
        unitCostUsd: 0

  - id: serp_api
    name: SerpAPI attraction discovery
    type: variable
    api: serpApi
    usageLevels:
      # Planning assumption based on the $25 / 1,000-search public tier.
      # Keep this editable alongside other estimator assumptions.
      - metric: searches
        unitCostUsd: 25
        perUnits: 1000

  - id: wikimedia
    name: Wikimedia attraction data
    type: variable
    api: wikimedia
    usageLevels:
      - metric: discovery_requests
        unitCostUsd: 0
      - metric: enrichment_requests
        unitCostUsd: 0
      - metric: summary_requests
        unitCostUsd: 0
      - metric: pageview_requests
        unitCostUsd: 0

  - id: frankfurter
    name: Frankfurter exchange rates
    type: variable
    api: frankfurter
    usageLevels:
      - metric: requests
        unitCostUsd: 0

  - id: airport_dataset
    name: Airport dataset refresh
    type: variable
    api: airportDataset
    usageLevels:
      - metric: requests
        unitCostUsd: 0

  - id: trip_blog_storage
    name: Trip blog storage and media delivery
    type: variable
    api: tripBlogStorage
    usageLevels:
      - metric: stored_gb_month
        unitCostUsd: 0.026
      - metric: gcs_operations
        unitCostUsd: 0.000004
      - metric: cdn_egress_gb
        unitCostUsd: 0.08
      - metric: cloud_run_gib_seconds
        unitCostUsd: 0.0000025

  - id: trip_blog_providers
    name: Trip blog external providers
    type: variable
    api: tripBlogProviders
    usageLevels:
      - metric: google_photos_requests
        unitCostUsd: 0
      - metric: meta_graph_requests
        unitCostUsd: 0
      - metric: translation_characters
        unitCostUsd: 0
      - metric: transcription_minutes
        unitCostUsd: 0

  - id: trip_blog_video_processing
    name: Trip blog bounded video processing
    type: variable
    api: tripBlogVideoProcessing
    usageLevels:
      - metric: processing_seconds
        unitCostUsd: 0.000024
      - metric: output_gb_month
        unitCostUsd: 0.026

  - id: trip_blog_social
    name: Trip blog social, recap, and generated artifacts
    type: variable
    api: tripBlogSocial
    usageLevels:
      - metric: cloud_run_requests
        unitCostUsd: 0.40
        perUnits: 1000000
      - metric: firestore_reads
        unitCostUsd: 0.06
        perUnits: 100000
      - metric: firestore_writes
        unitCostUsd: 0.18
        perUnits: 100000
      - metric: firestore_deletes
        unitCostUsd: 0.18
        perUnits: 100000
      - metric: retained_kib_month
        unitCostUsd: 0.026
        perUnits: 1048576
      - metric: static_map_requests
        unitCostUsd: 0.002
      # Conservative mini-model planning rates; actual calls remain attributed to the selected
      # provider by the standard AI registry and caller limiter.
      - metric: ai_caption_input_tokens
        unitCostUsd: 0.15
        perUnits: 1000000
      - metric: ai_caption_output_tokens
        unitCostUsd: 0.60
        perUnits: 1000000
      # Phase 7 keepsakes render from data already loaded on-device, so the operation has no
      # provider charge. Voice bytes use the same GCS price as other uploader-owned blog media.
      - metric: voice_note_gb_month
        unitCostUsd: 0.026
      - metric: keepsake_exports
        unitCostUsd: 0

  - id: plaid_transactions_subscription
    name: Plaid Transactions per connected account
    type: variable
    api: plaidTransactions
    usageLevels:
      - metric: connected_item_months
        unitCostUsd: 0.00 # replace from signed Plaid agreement before launch
  - id: plaid_google_cloud_usage
    name: Plaid Google Cloud usage
    type: variable
    api: plaidGoogleCloud
    usageLevels:
      - { metric: function_invocations, unitCostUsd: 0.40, perUnits: 1000000 }
      - { metric: firestore_reads, unitCostUsd: 0.06, perUnits: 100000 }
      - { metric: firestore_writes, unitCostUsd: 0.18, perUnits: 100000 }
      - { metric: firestore_deletes, unitCostUsd: 0.18, perUnits: 100000 }
      - { metric: retained_transaction_docs, unitCostUsd: 0.026 }
      - { metric: secret_manager_accesses, unitCostUsd: 0.00 } # replace with current regional price
      - { metric: kms_encryptions, unitCostUsd: 0.00 } # replace with current KMS operation price
      - { metric: kms_decryptions, unitCostUsd: 0.00 } # replace with current KMS operation price

  - id: itinerary_cache_binding_storage
    name: Itinerary Cache L1 Storage
    type: variable
    api: itineraryCache
    usageLevels:
      - { metric: binding_reads, unitCostUsd: 0.06, perUnits: 100000 }
      - { metric: binding_writes, unitCostUsd: 0.18, perUnits: 100000 }
      - { metric: corpus_reads, unitCostUsd: 0.06, perUnits: 100000 }
      - { metric: retained_kib_month, unitCostUsd: 0.000026 } # $0.026 per GB
      - { metric: road_trip_private_reads, unitCostUsd: 0.06, perUnits: 100000 }
      - { metric: road_trip_private_writes, unitCostUsd: 0.18, perUnits: 100000 }
      - { metric: route_matrix_elements, unitCostUsd: 0.005 }
      - { metric: weather_requests, unitCostUsd: 0 }
      - { metric: schedule_verifications, unitCostUsd: 0 }

  - id: itinerary_cache_authoring
    name: Itinerary Cache Authoring
    type: variable
    api: itineraryCache
    usageLevels:
      - { metric: author_tokens_input, unitCostUsd: 15.00, perUnits: 1000000 } # Sonnet 3.5 like
      - { metric: author_tokens_output, unitCostUsd: 75.00, perUnits: 1000000 }

  - id: itinerary_cache_binding_inference
    name: Itinerary Cache Binder (Tier 1)
    type: variable
    api: itineraryCache
    usageLevels:
      - { metric: binder_tokens_input, unitCostUsd: 0.15, perUnits: 1000000 } # 4o-mini
      - { metric: binder_tokens_output, unitCostUsd: 0.60, perUnits: 1000000 }

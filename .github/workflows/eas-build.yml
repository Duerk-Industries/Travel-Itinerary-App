name: Build and Deploy Expo App

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  expo-eas-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event-ref"
          git checkout --force refs/remotes/origin/event-ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) throw new Error('Node 20 or newer is required');"

      # Native builds consume EAS's monthly build-credit quota, so this only fires when
      # app/package.json's version actually bumped (the existing "Bump app version to X"
      # commit convention) rather than on every push to main -- routine fixes shouldn't
      # burn a build. Falls back to building if the previous version can't be determined
      # (e.g. the very first push), since skipping silently is worse than one extra build.
      - name: Check for app version bump
        id: version_check
        shell: bash
        run: |
          set -euo pipefail
          CURR_VERSION=$(node -e "console.log(require('./app/package.json').version)")
          PREV_VERSION=""
          if git fetch --no-tags --depth=1 origin "${{ github.event.before }}" 2>/dev/null; then
            PREV_VERSION=$(git show "${{ github.event.before }}:app/package.json" 2>/dev/null \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version)}catch{console.log('')}})" || echo "")
          fi
          echo "Previous version: ${PREV_VERSION:-<unknown>}"
          echo "Current version: $CURR_VERSION"
          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" = "$CURR_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund
        env:
          # patch-package's postinstall is part of the install; allow it.
          HUSKY: 0

      - name: Build native apps and export web
        if: steps.version_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd app
          npx --yes eas-cli@20.2.0 build --platform ios --profile production --non-interactive
          npx --yes eas-cli@20.2.0 build --platform android --profile production --non-interactive
          # Replace Hosting content with Expo web export on main
          npm run export:web -- --output-dir ../public
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Must be a real process env var for the local `eas build` CLI invocation, not
          # eas.json's build.<profile>.env (that block only reaches app-config resolution and
          # the remote build worker — the capability-sync step talks to Apple's Developer API
          # from this local process, before any of that). See
          # docs/expo-deployment-checklist.md's "Known failure mode" note.
          EXPO_NO_CAPABILITY_SYNC: "1"

      - name: Skipped (no version bump)
        if: steps.version_check.outputs.changed != 'true'
        shell: bash
        run: echo "app/package.json version unchanged since the previous commit on main -- skipping native build to conserve EAS build credits."

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel any in-flight runs of the same workflow on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app — typecheck + test + expo-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event-ref"
          git checkout --force refs/remotes/origin/event-ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) throw new Error('Node 20 or newer is required');"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # patch-package's postinstall is part of the install; allow it.
          HUSKY: 0

      - name: Typecheck app
        run: npm run typecheck:app

      - name: Test app
        run: npm run test:app

      - name: expo-doctor
        run: npx --prefix app expo-doctor
        # expo-doctor's exit code is the source of truth for project health;
        # any regression here (engine.io aliases removed, dependency drift, etc.)
        # blocks the PR.

  server:
    name: server — typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event-ref"
          git checkout --force refs/remotes/origin/event-ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) throw new Error('Node 20 or newer is required');"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Lint server
        run: npm run lint:server

      - name: Test server
        run: npm run test:server

      - name: Build server
        run: npm run build

  shared:
    name: shared packages — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event-ref"
          git checkout --force refs/remotes/origin/event-ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) throw new Error('Node 20 or newer is required');"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck messaging
        run: npm run typecheck:messaging

      - name: Typecheck domain
        run: npm run typecheck:domain

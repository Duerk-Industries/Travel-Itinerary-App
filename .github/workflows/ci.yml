name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any in-flight runs of the same workflow on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app — typecheck + test + expo-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # patch-package's postinstall is part of the install; allow it.
          HUSKY: 0

      - name: Typecheck app
        run: npm run typecheck:app

      - name: Test app
        run: npm run test:app

      - name: expo-doctor
        run: npx --prefix app expo-doctor
        # expo-doctor's exit code is the source of truth for project health;
        # any regression here (engine.io aliases removed, app.json drift, etc.)
        # blocks the PR.

  server:
    name: server — typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Lint server
        run: npm run lint:server

      - name: Test server
        run: npm run test:server

      - name: Build server
        run: npm run build

  shared:
    name: shared packages — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck messaging
        run: npm run typecheck:messaging

      - name: Typecheck domain
        run: npm run typecheck:domain

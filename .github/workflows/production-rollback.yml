name: Production Path - Rollback

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: "Manifest paired to the rollback target"
        required: true
      revision:
        description: "Cloud Run revision to receive 100% traffic"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Authenticate gcloud and Firebase
        run: |
          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/gcp-service-account.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-service-account.json"
          gcloud config set project "$GCLOUD_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-service-account.json" >> "$GITHUB_ENV"
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
      - name: Roll back production
        run: bash scripts/rollback.sh --release-manifest "${{ inputs.release_manifest }}" --revision "${{ inputs.revision }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
          DEPLOY_WORKER_SHARED_SECRET: ${{ secrets.DEPLOY_WORKER_SHARED_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-11-rollback-output
          path: dist/release

name: Deploy API to Cloud Run

on:
  push:
    branches:
      - main
  # Lets scripts/deploy-hosting.ps1 and scripts/deploy-hosting.sh trigger this same pipeline
  # (via `gh workflow run`) when deploying from a branch other than main — e.g. an emergency
  # fix that hasn't been merged yet. GitHub only offers workflow_dispatch for a workflow file
  # once this trigger exists on the *default* branch, so this addition needs to reach main once
  # before dispatching against other branches will work.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-api:
    # push events still only deploy from main (unchanged); workflow_dispatch is allowed from any
    # branch, since the whole point of dispatching by hand is to deploy something that isn't on
    # main yet.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/event-ref"
          git checkout --force refs/remotes/origin/event-ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) throw new Error('Node 20 or newer is required');"

      - run: npm ci

      - name: Export web frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix app run export:web -- --output-dir ../dist

      # server/public has no tracked files (git doesn't store empty directories), so a clean
      # checkout never has it -- server/Dockerfile's `COPY --from=build /app/public ./public`
      # fails outright without this (see scripts/build-release.sh, which has the same step for
      # the scripted Phase 11 pipeline). app.ts also serves this directory directly
      # (express.static), separately from the Firebase Hosting deploy of the same build.
      - name: Populate server/public
        shell: bash
        run: |
          set -euo pipefail
          rm -rf server/public
          mkdir -p server/public
          cp -r dist/. server/public/

      - name: Authenticate gcloud
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/gcp-service-account.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-service-account.json"
          gcloud config set project "$GCLOUD_PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-service-account.json" >> "$GITHUB_ENV"
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}

      - name: Deploy Firestore indexes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools deploy \
            --only firestore:indexes \
            --project "$GCLOUD_PROJECT_ID" \
            --non-interactive
        env:
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}

      - name: Deploy API
        shell: bash
        run: |
          set -euo pipefail
          cd server
          gcloud run deploy travel-itinerary-app \
            --source . \
            --region us-east5 \
            --memory 2Gi \
            --cpu 1 \
            --session-affinity \
            --max-instances 1 \
            --allow-unauthenticated \
            --service-account "travel-itinerary-app-sa@travel-itinerary-app-483623.iam.gserviceaccount.com" \
            --update-labels "app-git-sha=${GITHUB_SHA}" \
            --update-env-vars "WEB_URL=https://wander-bunnies.com,BACKEND_URL=https://wander-bunnies.com,GOOGLE_CALLBACK_URL=https://wander-bunnies.com/api/auth/google/callback,APPLE_CALLBACK_URL=https://wander-bunnies.com/api/auth/apple/callback,GIT_SHA=${GITHUB_SHA},NODE_OPTIONS=--max-old-space-size=1536" \
            --project "$GCLOUD_PROJECT_ID"
          gcloud run services update-traffic travel-itinerary-app \
            --region us-east5 \
            --to-latest \
            --project "$GCLOUD_PROJECT_ID"
          echo "Deployed API metadata: sha=${GITHUB_SHA}"
          if verification_json="$(gcloud run services describe travel-itinerary-app \
            --region us-east5 \
            --project "$GCLOUD_PROJECT_ID" \
            --format=json 2>/dev/null)"; then
            if verification_summary="$(printf '%s' "$verification_json" | jq -r '
              "memory=" + (.spec.template.spec.containers[0].resources.limits.memory // "<missing>"),
              "git_sha=" + (([.spec.template.spec.containers[0].env[]? | select(.name == "GIT_SHA") | .value] | first) // "<missing>")
            ' 2>/dev/null)"; then
              printf 'Deployment verification: %s\n' "$verification_summary"
            else
              echo '::warning::Deployment succeeded, but verification output could not be parsed.'
            fi
          else
            echo '::warning::Deployment succeeded, but Cloud Run verification was unavailable.'
          fi
        env:
          GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
